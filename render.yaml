services:
  - type: web
    name: flyrank-triage-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: MODEL_PATH
        value: model.pkl
      - key: SCALER_PATH
        value: scaler.pkl
      - key: HF_REPO_ID
        value: simon-okosodo-ds/flyrank-triage-model
      - key: MODEL_URL
        value: https://media.githubusercontent.com/media/simon-okosodo-ds/flyrank-triage-api/main/Flyrank_lr.pkl
